name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes foot lua5.4 mandoc shellcheck
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac
      - name: Regression tests
        run: make test
      - name: Shell and man-page lint
        run: make lint
      - name: Staged installation
        run: make install-check

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install package dependencies
        run: pacman -Syu --noconfirm foot lua
      - name: Build as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && make package"
      - name: Verify package contents
        run: ./tests/package.sh
